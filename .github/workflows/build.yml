# Shared build steps for one platform. Not run on its own: the workflows
# windows.yml, macos-apple-silicon.yml and macos-intel.yml call it (one per
# platform, so each gets its own status badge in the README).
#  - Every push / pull request: the installers are attached to the workflow run
#    as downloadable artifacts (Actions tab -> the run -> "Artifacts").
#  - Pushing a tag like v1.3.1: a draft GitHub Release is created with all
#    installers attached; review it and press "Publish".
name: Build installers

on:
  workflow_call:
    inputs:
      name:
        type: string
        required: true
      runner:
        type: string
        required: true
      target:
        type: string
        required: true
      bundles:
        type: string
        required: true
      # Windows: whisper.cpp's Vulkan build nests folders deeply; keep the build
      # folder path short (Windows 260-character limit).
      target_dir:
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: ${{ inputs.name }}
    runs-on: ${{ inputs.runner }}
    env:
      # Always an absolute path: cargo reads a relative one from src-tauri/, but
      # tauri-action reads it from the repository root and then can't find the
      # installers. Default: src-tauri/target.
      CARGO_TARGET_DIR: ${{ inputs.target_dir != '' && inputs.target_dir || format('{0}/src-tauri/target', github.workspace) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> ${{ inputs.target_dir != '' && inputs.target_dir || 'target' }}
          key: ${{ inputs.target }}

      # Windows: GPU support is built with Vulkan (needs the Vulkan SDK) and
      # whisper.cpp is built with Ninja (see src-tauri/.cargo/config.toml).
      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: latest
          install_runtime: false
          cache: true
      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y --no-progress

      - name: Cache Whisper models
        uses: actions/cache@v4
        with:
          path: src-tauri/resources/models
          key: whisper-ggml-large-v3-turbo-q5_0+small.en-q5_1

      - name: Download Whisper models (if not cached)
        shell: bash
        run: bash scripts/fetch-model.sh && ls -l src-tauri/resources/models

      - run: npm ci

      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ inputs.target }} --bundles ${{ inputs.bundles }}
          # Only create a (draft) release when a version tag was pushed.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: Kalam ${{ github.ref_name }}
          releaseBody: Offline meeting recorder & live transcriber. See README for installation notes.
          releaseDraft: true

      - name: Collect installers
        shell: bash
        run: |
          dir="${CARGO_TARGET_DIR}"
          case "$dir" in /*|?:*|?:\\*) ;; *) dir="src-tauri/$dir" ;; esac
          mkdir -p out
          find "$dir/${{ inputs.target }}/release/bundle" \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \) -exec cp {} out/ \;
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: kalam-${{ inputs.name }}
          path: out/*
          if-no-files-found: error
