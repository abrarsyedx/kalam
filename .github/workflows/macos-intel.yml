name: macOS (Intel)
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      name: macos-intel
      runner: macos-latest
      target: x86_64-apple-darwin
      bundles: app,dmg
