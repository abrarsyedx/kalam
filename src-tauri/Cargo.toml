[package]
name = "kalam"
version = "1.4.0"
description = "Kalam - offline meeting recorder and live transcriber"
authors = ["Kalam contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "kalam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
anyhow = "1"
chrono = "0.4"

# Audio capture (microphone + system loopback on Windows/macOS)
cpal = "0.18"
# Offline speech recognition (whisper.cpp). The -sys crate is used directly
# only to list the graphics devices ggml can use.
whisper-rs = "0.16"
whisper-rs-sys = "0.15"
# MP3 encoding (LAME)
mp3lame-encoder = "0.2"
# Word document writer
docx-rs = "0.4"

# GPU acceleration, with automatic fallback to the CPU (see src/gpu.rs):
# Vulkan on Windows (Intel, AMD and NVIDIA graphics), Metal on macOS.
[target.'cfg(windows)'.dependencies]
whisper-rs = { version = "0.16", features = ["vulkan"] }
# Speaker diarization (Speaker 1, Speaker 2, ...). On Windows as DLLs: the
# prebuilt static libraries use the static C runtime (/MT), Kalam uses /MD.
# Keep the version in sync with SHERPA_VERSION in build.rs.
sherpa-onnx = { version = "=1.13.6", default-features = false, features = ["shared"] }

[target.'cfg(not(windows))'.dependencies]
sherpa-onnx = "=1.13.6"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

[dev-dependencies]
hound = "3"
# Decodes MP3 benchmark recordings in tests (not used by the app).
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }
tauri = { version = "2", features = ["test"] }

[features]
# Optional NVIDIA CUDA backend (Windows/Linux, needs the CUDA Toolkit to build).
# Not needed for NVIDIA cards on Windows: Vulkan already covers them.
gpu-cuda = ["whisper-rs/cuda"]

[profile.dev.package."*"]
# Build dependencies (whisper.cpp, LAME) optimised even in dev builds,
# otherwise realtime transcription is far too slow to test.
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
